name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: earn_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d earn_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/earn_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/earn_test
      BOT_TOKEN: 123456789:TEST_ONLY_NOT_A_REAL_BOT_TOKEN_000000000
      REDIS_URL: redis://localhost:6379/15
      DEPLOY_ENV: development
      PYTHONPATH: .:yield-data-service:yield-telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check yield-data-service yield-telegram-bot demo tests scripts
      - run: python -m pytest tests yield-telegram-bot/tests yield-data-service/tests/models/test_models_pydantic.py yield-data-service/tests/models/test_models_response.py -q
      - run: pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: broadcast-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: broadcast-admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan published Git history with Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir /tmp/gitleaks
          cd /tmp/gitleaks
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks/gitleaks git . --log-opts='--branches --tags' --redact --config .gitleaks.toml
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:5173/api/v1/products
      - if: always()
        run: docker compose down --volumes
