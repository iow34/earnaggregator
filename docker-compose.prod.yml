# Configurable services for a private deployment. Read docs/deployment.md first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earn
      POSTGRES_DB: earn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earn -d earn"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  yield-api:
    build: .
    env_file: ${EARN_ENV_FILE:-.env}
    environment:
      SERVICE_NAME: yield-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  telegram-bot:
    build: .
    env_file: ${EARN_ENV_FILE:-.env}
    environment:
      SERVICE_NAME: telegram-bot
    profiles: [telegram]
  broadcast-admin:
    build: .
    env_file: ${EARN_ENV_FILE:-.env}
    environment:
      SERVICE_NAME: broadcast-admin
    ports:
      - "127.0.0.1:8081:8081"
    profiles: [broadcasts]
  broadcast-worker:
    build: .
    env_file: ${EARN_ENV_FILE:-.env}
    environment:
      SERVICE_NAME: broadcast-worker
    profiles: [broadcasts]
volumes:
  postgres_data:
  redis_data:
