version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: earn-postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./yield-data-service/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: earn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  yield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earn-yield-api
    restart: unless-stopped
    env_file: .env.production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: earn-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./yield-data-service/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./yield-data-service/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend_net
    depends_on:
      yield-api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:latest
    container_name: earn-alertmanager
    restart: unless-stopped
    env_file: .env.production
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./yield-data-service/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - backend_net

  grafana:
    image: grafana/grafana:latest
    container_name: earn-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./yield-data-service/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./yield-data-service/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./yield-data-service/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - backend_net
    depends_on:
      prometheus:
        condition: service_started

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: earn-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - backend_net

  db-backup:
    image: postgres:15-alpine
    container_name: earn-db-backup
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh
      - ./scripts/restore.sh:/usr/local/bin/restore.sh
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "echo '0 3 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root && crond -f -l 8",
      ]
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
    name: earn_backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
