# Credential-free interactive preview. Rates and users are synthetic.
services:
  preview:
    build: .
    environment:
      SERVICE_NAME: preview
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: broadcast-admin-web
      args:
        VITE_PREVIEW_MODE: "true"
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - ./broadcast-admin-web/nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      preview:
        condition: service_healthy
