# =============================================================================
# EarnAggregator - Docker Compose Configuration
# =============================================================================
# Версія: 1.0
# Дата: 13.10.2024
# Опис: Оркестрація всіх сервісів проекту
# =============================================================================

services:
  # =============================================================================
  # Database Services
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: earn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./yield-data-service/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: earn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Application Services
  # =============================================================================

  yield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earn-yield-api
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SERVICE_NAME=yield-api
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_API_SECRET=${OKX_API_SECRET}
      - OKX_API_PASSPHRASE=${OKX_API_PASSPHRASE}
      - KUCOIN_API_KEY=${KUCOIN_API_KEY}
      - KUCOIN_API_SECRET=${KUCOIN_API_SECRET}
      - KUCOIN_API_PASSPHRASE=${KUCOIN_API_PASSPHRASE}
      - GATE_API_KEY=${GATE_API_KEY}
      - GATE_API_SECRET=${GATE_API_SECRET}
      - BITGET_API_KEY=${BITGET_API_KEY}
      - BITGET_API_SECRET=${BITGET_API_SECRET}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - HTX_API_KEY=${HTX_API_KEY}
      - HTX_API_SECRET=${HTX_API_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - CACHE_EXPIRATION=${CACHE_EXPIRATION}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL}
    volumes:
      - ./.env:/app/.env
      - ./logs:/app/logs
      - ./yield-data-service/logs:/app/logs
      - ./yield-data-service/tests:/app/tests
      - ./yield-data-service/app:/app/app
    ports:
      - "8000:8000"
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Prometheus - РОЗДІЛ 3.3: Моніторинг метрик
  # =============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: earn-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./yield-data-service/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./yield-data-service/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend_net
    depends_on:
      yield-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # Grafana - РОЗДІЛ 3.3: Візуалізація метрик
  # =============================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: earn-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./yield-data-service/monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/earnaggregator.json
    ports:
      - "3000:3000"
    networks:
      - backend_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # Telegram Bot (Буде додано пізніше)
  # =============================================================================

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earn-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVICE_NAME=telegram-bot
      - BOT_TOKEN=${BOT_TOKEN}
      - DATA_SERVICE_URL=http://yield-api:8000
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
    command: python -m bot.main
    volumes:
      - ./yield-telegram-bot/bot:/app/bot
      - ./yield-telegram-bot/logs:/app/logs
      - ./.env:/app/.env
    networks:
      - backend_net
    depends_on:
      yield-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  broadcast-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earn-broadcast-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVICE_NAME=broadcast-admin
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
    command: uvicorn bot.admin_app:app --host 0.0.0.0 --port 8081
    volumes:
      - ./yield-telegram-bot/bot:/app/bot
      - ./yield-telegram-bot/logs:/app/logs
      - ./.env:/app/.env
    ports:
      - "8081:8081"
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  broadcast-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earn-broadcast-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVICE_NAME=broadcast-worker
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/1
    command: python -m bot.broadcasts.worker_app
    volumes:
      - ./yield-telegram-bot/bot:/app/bot
      - ./yield-telegram-bot/logs:/app/logs
      - ./.env:/app/.env
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # =============================================================================
  # Frontend (Буде додано пізніше)
  # =============================================================================

  # frontend:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: earn-frontend
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #     - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - frontend_net
  #     - backend_net
  #   depends_on:
  #     yield-api:
  #       condition: service_healthy

  broadcast-web:
    build:
      context: ./broadcast-admin-web
      dockerfile: Dockerfile
      # No VITE_BROADCAST_API_URL - will use /api proxy path
    container_name: earn-broadcast-web
    restart: unless-stopped
    depends_on:
      broadcast-admin:
        condition: service_started
    ports:
      - "${BROADCAST_WEB_PORT:-4173}:80"
    networks:
      - backend_net

# =============================================================================
# Networks
# =============================================================================

networks:
  backend_net:
    driver: bridge
    name: earn_backend
  frontend_net:
    driver: bridge
    name: earn_frontend

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
    name: earn_postgres_data
  redis_data:
    driver: local
    name: earn_redis_data
  prometheus_data:
    driver: local
    name: earn_prometheus_data
  grafana_data:
    driver: local
    name: earn_grafana_data
