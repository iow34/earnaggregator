#

groups:
  - name: earnaggregator_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="earnaggregator-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "🚨 EarnAggregator Service недоступний"
          description: "Основний сервіс не відповідає більше 2 хвилин"

      - alert: SlowResponse
        expr: probe_duration_seconds{job="earnaggregator-api"} > 5
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "⚠️ Повільні відповіді сервісу"
          description: "Сервіс відповідає повільніше 5 секунд"
