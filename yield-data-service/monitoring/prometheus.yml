
global:
  scrape_interval: 30s # Збір метрик кожні 30 секунд
  evaluation_interval: 30s # Оцінка правил кожні 30 секунд
  external_labels:
    monitor: "earnaggregator"
    environment: "production"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  - job_name: "earnaggregator-metrics"
    static_configs:
      - targets: ["yield-api:8000"] # Docker service name

    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "earnaggregator-api"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
